{% extends 'base.html' %}

{% block js%}
<script>
  Swal.fire({
    "position": 'top',
    "title": '<strong>Algunas consideraciones</strong>',
    "icon": 'warning',
    "html": 
    '<ul><li>Usar el EPP Correcto</li><li>Concentrarte en la tarea</li><li>Si necesitas ayuda, pídela.</li></ul>' +
    'and other HTML tags',
    "showCloseButton": true,
    "showCancelButton": true,
    "focusConfirm": false,
    "confirmButtonText":'<i class="bi bi-hand-thumbs-up-fill"></i> Genial!',
    "confirmButtonAriaLabel": 'Thumbs up, great!',
    "cancelButtonText":'<i class="bi bi-hand-thumbs-down-fill"></i> Nope!',
    "cancelButtonAriaLabel": 'Thumbs down'
  })
</script>
{% endblock %}



{% block content %}
{% load crispy_forms_tags %}

<h1 class="display-5 text-center">Tarea Nueva</h1>

{{error}}
<form action="/create_task/" method="POST"
  style="display: flex; flex-direction: column; max-width: 40vw; margin-inline: auto">
  <div class="d-flex justify-content-end">
    <a class="btn btn-outline-primary" href="{% url 'last_task' %}"><i class="bi bi-clipboard2-pulse"></i>Last Task</a>
    &nbsp;
    <button type="reset" class="btn btn-outline-secondary">Reset</button>
  </div>


  {% csrf_token %}
  {{form | crispy }}
  <p><br></p>

  <input class="btn btn-primary" type="submit" value="Iniciar">
</form>

{% endblock %}
