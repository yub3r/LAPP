<h1>Valor del Bitcoin en las últimas 24 horas</h1>
<canvas id="myChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.3/dist/Chart.min.js"></script>
<script>
    var ctx = document.getElementById("myChart").getContext("2d");
    var myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [{% for key, value in prices.items %}"{{ key }}",{% endfor %}],
    datasets: [{
        label: 'Dólares estadounidenses',
        data: [{% for key, value in prices.items %}"{{ value }}", {% endfor %}],
        backgroundColor: [
            'rgba(255, 99, 132, 0.2)',
        ],
            borderColor: [
                'rgba(255, 99, 132, 1)',
            ],
                borderWidth: 1
      }]
    },
    options: {
        scales: {
            yAxes: [{
                ticks: {
                    beginAtZero: true
                }
            }]
        }
    }
  });
</script>
