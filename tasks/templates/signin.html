{% extends 'base.html' %}
{% block content %}

<main class="container">
  <div class="row">
    <div class="col-md-4 offset-md-4">
      <form action="/signin/" method="POST" class="card card-body">
        <h1 class="display-5 text-center">Signin</h1>
        <p><br></p>
        {% csrf_token %}
        {{form}}
        <p><br></p>
        <h5 class="text-center">{{error}}</h5>
        <p><br></p>
        <button class="btn btn-primary">
          Signin
        </button>
      </form>
    </div>
  </div>

</main>
{% endblock %}
